version: v1

components:
- name: extract
  docker:
    file: extract/Dockerfile
  env:
  - name: S3_BUCKET
    config-ref: S3_BUCKET
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_ACCESS_KEY_ID
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_ACCESS_KEY_ID
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_SECRET_ACCESS_KEY
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__AWS_SECRET_ACCESS_KEY
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__ENDPOINT_URL
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__ENDPOINT_URL
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__S3_URL_STYLE
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__S3_URL_STYLE
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__S3_USE_SSL
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__S3_USE_SSL
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__REGION_NAME
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__CREDENTIALS__REGION_NAME
  - name: DB_HOST
    component-ref: db
  - name: POSTGRES_DB
    value: 'ducklake'
  - name: POSTGRES_USER
    config-ref: POSTGRES_USER
  - name: POSTGRES_PASSWORD
    config-ref: POSTGRES_PASSWORD
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__CATALOG
    value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__BUCKET_URL
    config-ref: DESTINATION__DUCKLAKE__CREDENTIALS__STORAGE__BUCKET_URL
  - name: SCHEMA__NAMING
    config-ref: SCHEMA__NAMING
  scheduled: "15 6 * * *"

- name: db
  docker:
    image: postgres:18
  env:
  - name: POSTGRES_USER
    config-ref: postgres_user
  - name: POSTGRES_PASSWORD
    config-ref: postgres_password
  - name: POSTGRES_DB
    value: 'ducklake'
  ports:
  - 5432
  storage:
  - name: database-data
    path: /var/lib/postgresql
    size: 100Mi

- name: transform
  docker:
    file: transform/Dockerfile
  env:
  - name: S3_BUCKET
    config-ref: S3_BUCKET
  - name: AWS_ACCESS_KEY_ID
    config-ref: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    config-ref: AWS_SECRET_ACCESS_KEY
  - name: AWS_REGION
    config-ref: AWS_REGION
  - name: ENDPOINT_URL
    config-ref: ENDPOINT_URL
  - name: DB_HOST
    component-ref: db
  - name: POSTGRES_DB
    value: 'ducklake'
  - name: POSTGRES_USER
    config-ref: POSTGRES_USER
  - name: POSTGRES_PASSWORD
    config-ref: POSTGRES_PASSWORD
  - name: DESTINATION__DUCKLAKE__CREDENTIALS__CATALOG
    value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(DB_HOST):5432/$(POSTGRES_DB)
  - name: DBT_TARGET
    value: "dev"
  scheduled: "@release"
  max-retries: 0

- name: pgadmin
  docker:
    image: dpage/pgadmin4
  env:
  - name: PGADMIN_DEFAULT_EMAIL
    config-ref: PGADMIN_DEFAULT_EMAIL
  - name: PGADMIN_DEFAULT_PASSWORD
    config-ref: PGADMIN_DEFAULT_PASSWORD
  - name: PGADMIN_CONFIG_SERVER_MODE
    value: 'False'
  storage:
  - name: pgadmin-data
    path: /var/lib/pgadmin
    size: 500Mi